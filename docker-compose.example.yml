# Example: run the System API MCP daemon as a sidecar next to an existing
# DreamFactory docker-compose stack (network `dreamfactory_default`). By default
# the daemon runs inside the DreamFactory container instead; see README "Running".
#
#   docker compose -f docker-compose.example.yml up -d --build
#
# On the DreamFactory side set (in the `web` container env):
#   MCP_SYSTEM_DAEMON_ENABLED=true
#   MCP_SYSTEM_DAEMON_URL=http://df-system-mcp:3700
#   MCP_SYSTEM_DAEMON_BASE_URL=http://web
#   MCP_INTERNAL_KEY=<same value as below, recommended>
services:
  df-system-mcp:
    build: .
    container_name: df-system-mcp
    restart: unless-stopped
    environment:
      PORT: "3700"
      HOST: "0.0.0.0"
      DREAMFACTORY_URL: http://web/api/v2
      # MCP_INTERNAL_KEY: change-me
      # SESSION_TTL_SECONDS: "1800"
      # MCP_EXPOSE_API_KEYS: "true"   # unmask app API keys (not recommended)
    expose:
      - "3700"
    networks:
      - dreamfactory_default

networks:
  dreamfactory_default:
    external: true
